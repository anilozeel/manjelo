name: Hostinge yükle (cPanel)

# Site, sunucudaki cron işiyle GitHub'dan çekiliyor (bkz. README).
# Bu akış yedek olarak duruyor ve yalnızca elle çalıştırılır (Actions → Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUNUCU: ${{ vars.FTP_SERVER || 'mt-charon.guzelhosting.com' }}
  KULLANICI: ${{ vars.FTP_USERNAME || 'manjelob' }}
  HEDEF: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
  # sftp (şifreli, SSH erişimi gerekir) ya da ftp (şifresiz). Variables sekmesinden değiştirilebilir.
  PROTOKOL: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
  SSH_PORT: ${{ vars.SSH_PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Şifre tanımlı mı?
        id: kontrol
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP_PASSWORD secret'ı tanımlı değil; yükleme atlandı. Settings > Secrets and variables > Actions bölümünden ekleyin."
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.kontrol.outputs.hazir == 'true'

      - name: SFTP ile public_html'e yükle
        if: steps.kontrol.outputs.hazir == 'true' && env.PROTOKOL == 'sftp'
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if ! timeout 10 bash -c "echo > /dev/tcp/$SUNUCU/$SSH_PORT"; then
            echo "::error::$SUNUCU:$SSH_PORT portuna bağlanılamadı. Hosting firmasından SSH erişimini ve port numarasını öğrenip SSH_PORT değişkenini ayarlayın."
            exit 1
          fi
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$KULLANICI,$FTP_PASSWORD" -p "$SSH_PORT" "sftp://$SUNUCU" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            mirror --reverse --only-newer --verbose ./public/ $HEDEF;
            quit"

      - name: FTP ile public_html'e yükle
        if: steps.kontrol.outputs.hazir == 'true' && env.PROTOKOL == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.SUNUCU }}
          username: ${{ env.KULLANICI }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./public/
          server-dir: ${{ env.HEDEF }}
